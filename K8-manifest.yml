---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: appointment-app-pvc
spec:
  storageClassName: gp2
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-app
  labels:
    app: appointment-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: appointment-app

  template:
    metadata:
      labels:
        app: appointment-app

    spec:
      containers:
        - name: appointment-app
          image: IMAGE_PLACEHOLDER
          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          volumeMounts:
            - name: appointment-app-storage
              mountPath: /data

          readinessProbe:
            httpGet:
              path: /register
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /register
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3

          startupProbe:
            httpGet:
              path: /register
              port: 8080
            periodSeconds: 10
            failureThreshold: 30

      volumes:
        - name: appointment-app-storage
          persistentVolumeClaim:
            claimName: appointment-app-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: appointment-app-service
spec:
  selector:
    app: appointment-app

  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP

  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: appointment-app-ingress
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: appointment-app-service
            port:
              number: 8080
